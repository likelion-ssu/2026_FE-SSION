<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>인스타그램 클론코딩</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <!-- 왼쪽 사이드바 -->
            <div id="left">
                <div class="left-top">
                    <img src="dummy_black.png" class="logo">
                </div>

                <div class="left-center">
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>홈</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>검색</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>탐색 탭</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>릴스</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>메시지</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>알림</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>만들기</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>프로필</span>
                    </div>
                </div>

                <div class="left-bottom">
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>Threads</span>
                    </div>
                    <div class="navigation">
                        <img src="dummy_black.png" class="nav-img">
                        <span>더 보기</span>
                    </div>
                </div>
            </div>

            <!-- 가운데 메인 피드 -->
            <div id="center">
                <!-- 스토리 -->
                <div id="center-top">
                    <div class="center-top-detail">
                        <img src="dummy_black.png">
                        <span>seo_ye0n4</span>
                    </div>
                    <div class="center-top-detail">
                        <img src="dummy_black.png">
                        <span>kdm1258</span>
                    </div>
                    <div class="center-top-detail">
                        <img src="dummy_black.png">
                        <span>kdm1258</span>
                    </div>
                    <div class="center-top-detail">
                        <img src="dummy_black.png">
                        <span>kdm1258</span>
                    </div>
                </div>

                <!-- 게시글 -->
                <div id="center-bottom">
                    <div class="post">
                        <div class="post-header">
                            게시글 헤더
                        </div>
                        <div class="post-image">
                            게시글 이미지
                        </div>
                        <div class="post-icons">
                            아이콘 영역
                        </div>
                        <div class="post-content">
                            게시글 내용
                        </div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 추천 영역 -->
            <div id="right">
                <div id="right-top">
                    <img src="dummy_black.png">
                    <div class="right-top-profile">
                        <span>seo_ye0n4</span>
                        <span>박서연</span>
                    </div>
                    <span class="txt">전환</span>
                </div>

                <div id="right-center">
                    <span>회원님을 위한 추천</span>
                    <span>모두 보기</span>
                </div>

                <div id="right-bottom">
                    <div class="right-bottom-detail">
                        <img src="dummy_black.png">
                        <div class="right-bottom-detail-ex">
                            <span>recommend_person1</span>
                            <span>jxxi.0457 외 1명이 팔로우합니다</span>
                        </div>
                        <span class="txt">팔로우</span>
                    </div>
                    <div class="right-bottom-detail">
                        <img src="dummy_black.png">

                        <div class="right-bottom-detail-ex">
                            <span>recommend_person2</span>
                            <span>jxxi.0457 외 1명이 팔로우합니다</span>
                        </div>
                        <span class="txt">팔로우</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
