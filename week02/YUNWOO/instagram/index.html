<!DOCTYPE html>
<html>
    <head>
        <title>
            Instagram
        </title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
  <div class="instagram">

    <aside class="sidebar">
        <div class="logo">
            <img src="assets/logo.png" alt="logo">
        </div>

        <nav class="menu">

            <a href="#">
                <img src="assets/home.png" alt="">
                <span>홈</span>
            </a>

            <a href="#">
                <img src="assets/search.png" alt="">

            </a>

            <a href="#">
                <img src="assets/explore.png" alt="">

            </a>

            <a href="#">
                <img src="assets/reels.png" alt="">
                <span>릴스</span>
            </a>

            <a href="#">
                <img src="assets/message.png" alt="">
                <span>메시지</span>
            </a>

            <a href="#">
                <img src="assets/heart.png" alt="">
                <span>알림</span>
            </a>

            <a href="#">
                <img src="assets/create.png" alt="">
                <span>만들기</span>
            </a>

            <a href="#">
                <img src="assets/profile.jpg" alt="" class="profile-icon">
                <span>프로필</span>
            </a>

        </nav>

    </aside>

    <main class="feed">
      <section class="stories">

    <div class="story">
        <img src="assets/profile.jpg" alt="">
        <p>gogumii1</p>
    </div>

    <div class="story">
        <img src="assets/profile.jpg" alt="">
        <p>gogumii2</p>
    </div>

    <div class="story">
        <img src="assets/profile.jpg" alt="">
        <p>gogumii3</p>
    </div>

    <div class="story">
        <img src="assets/profile.jpg" alt="">
        <p>gogumii4</p>
    </div>

</section>

      <article class="post">
        <div class="post-header">

    <div class="post-user">
        <img src="assets/profile.jpg" alt="">
        
        <div>
            <strong>gogumiiiii</strong>
            <span>2시간</span>
        </div>
        </div>

        <span>...</span>

    </div>
        <img src="assets/post.jpg" alt="" class="post-image">

        <div class="post-actions">

        <div class="left-icons">
            <img src="assets/heart.png" alt="">
            <img src="assets/comment.png" alt="">
            <img src="assets/message.png" alt="">
        </div>

            <img src="assets/bookmark.png" alt="">

        </div>
        <p><strong>좋아요 32개</strong></p>
        <p><strong>gogumiiiiii</strong> 프론트엔드 화이팅~!</p>
      </article>
    </main>

    <aside class="rightbar">
    <div class="my-profile">
        <div class="profile-info">
            <img src="assets/profile.jpg" alt="">

            <div>
                <strong>gogumiiiii</strong>
                <p>gogumii</p>
            </div>
        </div>

        <a href="#">전환</a>
    </div>

    <div class="recommend-header">
        <p>회원님을 위한 추천</p>
        <a href="#">모두 보기</a>
    </div>

    <div class="recommend-user">
        <div class="profile-info">
            <img src="assets/profile.jpg" alt="">

            <div>
                <strong>recommend_person1</strong>

            </div>
        </div>

        <a href="#">팔로우</a>
    </div>

    <div class="recommend-user">
        <div class="profile-info">
            <img src="assets/profile.jpg" alt="">

            <div>
                <strong>recommend_person2</strong>
                <p>회원님을 위한 추천</p>
            </div>
        </div>

        <a href="#">팔로우</a>
    </div>
</aside>

  </div>

</html>
