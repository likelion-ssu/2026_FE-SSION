<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>인스타그램 클론코딩</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="container">
            <!-- 왼쪽 사이드바 -->
            <div id="left">
                <div class="left-top">
                    <i class="bi bi-instagram"></i>
                </div>

                <div class="left-center">
                    <div class="navigation">
                        <i class="bi bi-house-door-fill"></i>
                        <span>홈</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-play-btn nav-icon"></i>
                        <span>릴스</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-send"></i>
                        <span>메시지</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-search nav-icon"></i>
                        <span>검색</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-compass nav-icon"></i>
                        <span>탐색 탭</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-heart nav-icon"></i>
                        <span>알림</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-plus-lg"></i>
                        <span>만들기</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-person-circle nav-icon"></i>
                        <span>프로필</span>
                    </div>
                </div>

                <div class="left-bottom">
                    <div class="navigation">
                        <i class="bi bi-list nav-icon"></i>
                        <span>더 보기</span>
                    </div>
                    <div class="navigation">
                        <i class="bi bi-grid"></i>
                        <span>Meta의 다른 앱</span>
                    </div>
                </div>
            </div>

            <!-- 가운데 메인 피드 -->
            <div id="center">
                <!-- 스토리 -->
                <div id="center-top">
                    <div class="center-top-detail">
                        <img src="assets/profile.png">
                        <span>seo_ye0n4</span>
                    </div>
                    <div class="center-top-detail">
                        <img src="assets/profile.png">
                        <span>odooou4</span>
                    </div>
                    <div class="center-top-detail">
                        <img src="assets/leeun.png">
                        <span>leeun04</span>
                    </div>
                    <div class="center-top-detail">
                        <img src="assets/likelion.png">
                        <span>likelion_ssu</span>
                    </div>
                    <div class="center-top-detail">
                        <img src="assets/globalmedia.png">
                        <span>ssu_globalmedia</span>
                    </div>
                </div>

                <!-- 게시글 -->
                <div id="center-bottom">
                    <div class="post">
                        <div class="post-header">
                            게시글 헤더
                        </div>
                        <div class="post-image">
                            게시글 이미지
                        </div>
                        <div class="post-icons">
                            아이콘 영역
                        </div>
                        <div class="post-content">
                            게시글 내용
                        </div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 추천 영역 -->
            <div id="right">
                <div id="right-top">
                    <img src="assets/profile.png">
                    <div class="right-top-profile">
                        <span>seo_ye0n4</span>
                        <span>박서연</span>
                    </div>
                    <span class="txt">전환</span>
                </div>

                <div id="right-center">
                    <span>회원님을 위한 추천</span>
                    <span>모두 보기</span>
                </div>

                <div id="right-bottom">
                    <div class="right-bottom-detail">
                        <img src="assets/wdohwan.png">
                        <div class="right-bottom-detail-ex">
                            <span>wdohwan</span>
                            <span>yy_0n0님 외 7명이 팔로우합니다</span>
                        </div>
                        <span class="txt">팔로우</span>
                    </div>
                    <div class="right-bottom-detail">
                        <img src="assets/pampermoony.png">
                        <div class="right-bottom-detail-ex">
                            <span>pampermoony</span>
                            <span>yy_0n0님 외 2명이 팔로우합니다</span>
                        </div>
                        <span class="txt">팔로우</span>
                    </div>
                    <div class="right-bottom-detail">
                        <img src="assets/ssodam.png">
                        <div class="right-bottom-detail-ex">
                            <span>ssodam_xoxo</span>
                            <span>frog님 외 1명이 팔로우합니다</span>
                        </div>
                        <span class="txt">팔로우</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
