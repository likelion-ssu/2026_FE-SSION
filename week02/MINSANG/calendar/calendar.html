<head>
    <title>calendar</title>
    <link rel="stylesheet" href="calendar.css">
</head>
<body>
    <div class="calendar">
        <div class="calendar-header">
            <button class="before-btn">&lt;</button>
            <div class="title">
                <span class="year"></span>
                <span class="month"></span>
            </div>
            <button class="after-btn">&gt;</button>
        </div>
        <div class="calendar-body">
            <div class="days">
                <div class="day">월</div>
                <div class="day">화</div>
                <div class="day">수</div>
                <div class="day">목</div>
                <div class="day">금</div>
                <div class="day sat">토</div>
                <div class="day sun">일</div>
            </div>
            <div class="dates"></div>
        </div>
    </div>
</body>
