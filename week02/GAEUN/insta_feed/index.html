<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Feed</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      Instagram
    </div>

    <nav class="menu">

      <div class="menu-item">
        <i class="fa-solid fa-house"></i>
      </div>

      <div class="menu-item">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <div class="menu-item">
        <i class="fa-regular fa-compass"></i>
      </div>

      <div class="menu-item">
        <i class="fa-solid fa-clapperboard"></i>
      </div>

      <div class="menu-item">
        <i class="fa-regular fa-heart"></i>
      </div>

      <div class="menu-item">
        <i class="fa-regular fa-circle-user"></i>
      </div>

    </nav>

  </aside>

  <main class="feed">

    <section class="stories">

      <div class="story">
        <div class="story-img"></div>
        <p>sunwin1</p>
      </div>

      <div class="story">
        <div class="story-img"></div>
        <p>jung_in</p>
      </div>

      <div class="story">
        <div class="story-img"></div>
        <p>habin</p>
      </div>

      <div class="story">
        <div class="story-img"></div>
        <p>yunwoo_</p>
      </div>

      <div class="story">
        <div class="story-img"></div>
        <p>m_insang</p>
      </div>

      <div class="story">
        <div class="story-img"></div>
        <p>seo_ye0n</p>
      </div>

    </section>

    <section class="post">

      <div class="post-header">
        <div class="profile-circle"></div>
        <span>always_kia_tigers</span>
      </div>

      <div class="post-image"></div>

      <div class="post-icons">

        <div class="left-icons">
          <div class="icon-count">
            <i class="fa-regular fa-heart"></i>
            <span>1.7만</span>
          </div>

          <div class="icon-count">
            <i class="fa-regular fa-comment"></i>
            <span>135</span>
          </div>

          <div class="icon-count">
            <i class="fa-regular fa-paper-plane"></i>
            <span>164</span>
          </div>
        </div>

        <i class="fa-regular fa-bookmark"></i>

      </div>

      <div class="post-text">
        <p><strong>always_kia_tigers</strong> 승리의 마지막 아웃카운트는!</p>
      </div>

    </section>

  </main>

   <aside class="recommend">

    <div class="my-profile">
      <div class="profile-circle"></div>
      <div>
        <p class="id">oeuniey</p>
        <p class="name">가은</p>
      </div>
      <a href="#">전환</a>
    </div>

    <div class="recommend-title">
      <span>회원님을 위한 추천</span>
      <strong>모두 보기</strong>
    </div>

    <div class="recommend-user">
      <div class="profile-circle"></div>
      <div>
        <p class="id">fe_ssion</p>
        <p class="name">회원님을 위한 추천</p>
      </div>
      <a href="#">팔로우</a>
    </div>

    <div class="recommend-user">
      <div class="profile-circle"></div>
      <div>
        <p class="id">daye_8</p>
        <p class="name">lions님 외 29명이 팔로우</p>
      </div>
      <a href="#">팔로우</a>
    </div>

    <div class="recommend-user">
      <div class="profile-circle"></div>
      <div>
        <p class="id">uk_yeong</p>
        <p class="name">sunwin1님 외 55명이 팔로우</p>
      </div>
      <a href="#">팔로우</a>
    </div>

    <div class="recommend-user">
      <div class="profile-circle"></div>
      <div>
        <p class="id">jungan2</p>
        <p class="name">circlejae님 외 37명이 팔로우</p>
      </div>
      <a href="#">팔로우</a>
    </div>

  </aside>

</body>
</html>
