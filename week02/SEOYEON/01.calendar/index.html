<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>캘린더</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calendar">

        <div class="top">
            <button id="prev">◀</button>
            <h2 id="title"></h2>
            <button id="next">▶</button>
        </div>

        <div class="day">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div class="date" id="date"></div>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
