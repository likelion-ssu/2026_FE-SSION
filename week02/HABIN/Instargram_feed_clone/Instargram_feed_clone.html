<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instargram</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: row;
        }
    </style>
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="./assets/instargram_icon.png" alt="로고">
        </div>
        <div class="menu">
            <img src="./assets/home.png" alt="홈">
            <img src="./assets/reels.png" alt="릴스">
            <img src="./assets/DM.png" alt="디엠">
            <img src="./assets/Magnifier.png" alt="검색">
            <img src="./assets/exploration.png" alt="탐색 탭">
            <img src="./assets/heart.png" alt="알림">
            <img src="./assets/plus.png" alt="만들기">
            <img src="./assets/profile.jpeg" alt="프로필">
        </div>
        <div class="etc">
            <img src="./assets/see_more.png" alt="더보기">
            <img src="./assets/plus_app.png" alt="다른 앱">
        </div>
    </header>

    <main class="main">
        <div class="story_tray">
            <div class="story">
                <div class="story1">
                    <img src="./assets/profile.jpeg" alt="기본프로필">
                    <p>HABIN1</p>
                </div>
                <div class="story2">
                    <img src="./assets/profile.jpeg" alt="기본프로필">
                    <p>HABIN2</p>
                </div>
                <div class="story3">
                    <img src="./assets/profile.jpeg" alt="기본프로필">
                    <p>HABIN3</p>
                </div>
                <div class="story4">
                    <img src="./assets/profile.jpeg" alt="기본프로필">
                    <p>HABIN4</p>
                </div>
                <div class="story5">
                    <img src="./assets/profile.jpeg" alt="기본프로필">
                    <p>HABIN5</p>
                </div>
                <div class="story6">
                    <img src="./assets/profile.jpeg" alt="기본프로필">
                    <p>HABIN6</p>
                </div>
            </div>
        </div>

        <div class="feed">
            <div class="user_information">
                <div class="user_profile">
                    <img src="./assets/profile.jpeg" alt="기본프로필">
                </div>
                <div class="user_name">
                    <p>HABIN 2일</p>
                </div>
                <div class="user_menu">
                    <img src="./assets/menu.png" alt="메뉴">
                </div>
            </div>
            <div class="feed_image">
                <img src="./assets/feed_image.JPG" alt="피드이미지">
            </div>
            <div class="feed_content_reaction">
                <div class="feed_reaction">
                    <div class="feed_reaction_left">
                        <img src="./assets/heart.png" alt="좋아요">
                        <p>777</p>
                        <img src="./assets/speech_bubble.png" alt="댓글">
                        <p>5</p>
                        <img src="./assets/DM.png" alt="공유">
                    </div>
                    <div class="feed_reaction_right">
                        <img src="./assets/bookmark.png" alt="북마크"> 
                    </div>
                </div>
                <div class="feed_content">
                    <p>
                        프론트엔드 화이팅
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer_information">
            <div class="my_account">
                <img src="./assets/profile.jpeg" alt="프로필">
                <div class="my_account_name">
                    <p>HABIN</p>
                    <p>신하빈</p>
                </div>
                <p class="switch">전환</p>
            </div>
            <div class="recommend_friend">
                <div class="recommend">
                    <p id ="recommend_text1">회원님을 위한 추천</p>
                    <p id ="recommend_text2">모두보기</p>
                </div>
                <div class="recommend_friend_list">
                    <div class="recommend_friends">
                        <img src="./assets/profile.jpeg" alt="프로필">
                        <div class="my_account_name">
                            <p>FRIEND1</p>
                            <p>신하빈</p>
                        </div>
                        <p class="switch">팔로우</p>
                    </div>
                    <div class="recommend_friends">
                        <img src="./assets/profile.jpeg" alt="프로필">
                        <div class="my_account_name">
                            <p>FRIEND2</p>
                            <p>신하빈</p>
                        </div>
                        <p class="switch">팔로우</p>
                    </div>
                    <div class="recommend_friends">
                        <img src="./assets/profile.jpeg" alt="프로필">
                        <div class="my_account_name">
                            <p>FRIEND3</p>
                            <p>신하빈</p>
                        </div>
                        <p class="switch">팔로우</p>
                    </div>
                    <div class="recommend_friends">
                        <img src="./assets/profile.jpeg" alt="프로필">
                        <div class="my_account_name">
                            <p>FRIEND4</p>
                            <p>신하빈</p>
                        </div>
                        <p class="switch">팔로우</p>
                    </div>
                    <div class="recommend_friends">
                        <img src="./assets/profile.jpeg" alt="프로필">
                        <div class="my_account_name">
                            <p>FRIEND5</p>
                            <p>신하빈</p>
                        </div>
                        <p class="switch">팔로우</p>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
